name: Python CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FULL_NAME: "Сокол Тимур" 
      GROUP_NUMBER: "М3110"

    steps:
      - name: Вывод информации
        run: echo "ФИО: ${{ env.FULL_NAME }}, Группа: ${{ env.GROUP_NUMBER }}, GitHub: ${{ github.actor }}"

      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск юнит-тестов
        run: python -m pytest discover

      - name: Проверка стиля кода (flake8)
        run: flake8 .
